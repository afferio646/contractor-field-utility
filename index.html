<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Field Utility | Unified Estimation Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 50;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

        .view-banner { 
            background: var(--warning); 
            color: #000; 
            text-align: center; 
            padding: 0.5rem; 
            font-weight: 800; 
            font-size: 0.75rem; 
            text-transform: uppercase;
        }

        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--border); color: var(--text-primary); }
        .btn-success { background: var(--success); color: white; }
        .btn-toggle { background: var(--warning); color: #000; border: 2px solid #000; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 1rem;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%; max-width: 650px;
            border-radius: 16px; padding: 2rem;
            max-height: 95vh; overflow-y: auto;
        }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; color: var(--text-secondary); margin-bottom: 0.4rem; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        input, select, textarea {
            width: 100%; padding: 0.8rem;
            background: var(--bg-dark); border: 1px solid var(--border);
            border-radius: 8px; color: white; font-size: 1rem;
        }

        .scan-img-placeholder {
            width: 100%; height: 200px;
            background: #000;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            border: 2px dashed var(--border);
        }

        .hidden { display: none !important; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-contractor { background: rgba(37, 99, 235, 0.2); color: var(--primary); border: 1px solid var(--primary); }
        .badge-vendor { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    </style>
</head>
<body>

    <div id="vendorBanner" class="view-banner hidden">Vendor Mode: Inputting Estimate & Timeline Justification</div>

    <header class="header">
        <div>
            <h2 style="font-size: 1.2rem;">Estimator Pro</h2>
            <div id="roleBadge" class="badge badge-contractor">Main Contractor</div>
        </div>
        <button class="btn btn-toggle" onclick="toggleRole()">Switch Demo Perspective</button>
    </header>

    <div class="container">
        <div id="dashboardView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Active Projects</h1>
                <div id="contractorDashboardActions">
                    <button class="btn btn-primary" onclick="showModal('initProjectModal')">+ Create New Project</button>
                    <button class="btn btn-secondary" onclick="alert('Archive View Selected')">Project Archive</button>
                </div>
            </div>
            <div class="grid" id="projectGrid">
                </div>
        </div>

        <div id="projectDetailView" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <button class="btn btn-secondary" onclick="showDashboard()">← Back to Dashboard</button>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-success" onclick="generateReport()">Download Full Quote Report</button>
                    <button id="archiveBtn" class="btn btn-secondary" onclick="showDashboard()">Archive Job</button>
                </div>
            </div>

            <div id="reportTarget" class="card">
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem;">
                    <h1 id="activeProjectTitle" style="font-size: 2.5rem;">Project Name</h1>
                    <p id="activeProjectInfo" style="color: var(--text-secondary);"></p>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>Project Scan Records</h3>
                    <button id="contractorAddScanBtn" class="btn btn-primary" onclick="initiateScan()">+ Add New Scan/Photo</button>
                </div>

                <div id="scanGrid" class="grid">
                    </div>
            </div>
        </div>
    </div>

    <div id="initProjectModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Step 1: Project Initiation</h2>
            <div class="form-group"><label>Client Name</label><input type="text" id="pClient" placeholder="e.g. Anderson Residence"></div>
            <div class="form-group"><label>Job Site Address</label><input type="text" id="pAddress" placeholder="Full Site Address"></div>
            <div class="form-group"><label>Project Manager</label><input type="text" id="pManager" placeholder="Name of Manager"></div>
            <div class="form-group"><label>Initial Target Completion Date</label><input type="date" id="pDate"></div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="btn btn-primary" onclick="saveNewProject()">Initiate Project</button>
                <button class="btn btn-secondary" onclick="hideModal('initProjectModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="scanModal" class="modal hidden">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 id="scanTitle">Field Data Capture</h2>
                <button class="btn btn-secondary" onclick="hideModal('scanModal')">✕</button>
            </div>
            
            <div class="scan-img-placeholder">
                <img src="https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=800" style="width:100%; height:100%; object-fit:cover; border-radius:12px;">
            </div>

            <div id="contractorInputFields">
                <div class="form-group"><label>Area</label><input type="text" class="c-input" id="rArea" placeholder="e.g. Master Bedroom Ceiling"></div>
                <div class="form-group">
                    <label>Texture</label>
                    <select class="c-input" id="rTexture">
                        <option>Smooth Drywall</option><option>Stucco</option><option>Popcorn</option>
                    </select>
                </div>
                <div class="form-group"><label>Color / Paint Code</label><input type="text" class="c-input" id="rColor" placeholder="e.g. SW 7006 Off-White"></div>
                <div class="form-group"><label>Dimensions</label><input type="text" class="c-input" id="rDims" placeholder="e.g. 12ft x 14ft"></div>
                <div class="form-group"><label>Required Action/Notes</label><textarea class="c-input" id="rNotes" rows="2" placeholder="Describe damage..."></textarea></div>
            </div>

            <div id="handoffSection" style="border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem;">
                <label>Select Vendor for Estimate</label>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <select id="vendorSelect" style="flex:1;">
                        <option>Mainline Drywall (bids@mainline.com)</option>
                        <option>Elite Paint Services (service@elite.com)</option>
                    </select>
                    <button class="btn btn-secondary" onclick="alert('Opening Vendor Management...')">+ Add Vendor</button>
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="alert('Project Link & Data Sent to Vendor via Secure Link!')">Send Information to Vendor</button>
            </div>

            <div id="vendorInputFields" class="hidden" style="border-top: 2px solid var(--warning); padding-top: 1.5rem; margin-top: 1.5rem;">
                <h3 style="color: var(--warning); margin-bottom: 1rem;">Subcontractor Bid & Timeline</h3>
                <div class="form-group"><label>Estimate Price ($)</label><input type="number" id="vPrice" placeholder="0.00"></div>
                <div class="form-group"><label>Upload Pic of Estimate</label><button class="btn btn-secondary" style="width:100%" onclick="alert('Camera Activation Simulated')">📷 Capture Formal Quote Document</button></div>
                <div class="form-group"><label style="display:flex; align-items:center; gap:0.5rem;"><input type="checkbox" id="vEmailCheck"> Sent Estimate via Email</label></div>
                <div class="form-group"><label>Estimated Start Date</label><input type="date" id="vDate"></div>
                <div class="form-group"><label>Timeline Notes / Justification</label><textarea id="vNotes" rows="2" placeholder="e.g. Requires 3 days for curing..."></textarea></div>
                <button class="btn btn-primary" style="width:100%;" onclick="submitVendorBid()">Submit Estimate & Timeline</button>
            </div>

            <div style="margin-top: 2rem;">
                <button id="contractorSaveBtn" class="btn btn-primary" onclick="saveScanRecord()">Save Field Documentation</button>
            </div>
        </div>
    </div>

    <script>
        // DATA OBJECTS
        let currentRole = 'contractor';
        let projects = [];
        let activeProject = null;

        // NAVIGATION & TOGGLE (STEP 3/4 LOGIC)
        function toggleRole() {
            currentRole = (currentRole === 'contractor') ? 'vendor' : 'contractor';
            document.getElementById('roleBadge').innerText = (currentRole === 'contractor') ? 'Main Contractor' : 'Subcontractor';
            document.getElementById('roleBadge').className = 'badge ' + (currentRole === 'contractor' ? 'badge-contractor' : 'badge-vendor');
            document.getElementById('vendorBanner').classList.toggle('hidden');
            document.getElementById('vendorInputFields').classList.toggle('hidden');
            document.getElementById('handoffSection').classList.toggle('hidden');
            document.getElementById('contractorDashboardActions').classList.toggle('hidden');
            document.getElementById('contractorAddScanBtn').classList.toggle('hidden');
            document.getElementById('contractorSaveBtn').classList.toggle('hidden');
            
            document.querySelectorAll('.c-input').forEach(i => i.disabled = (currentRole === 'vendor'));
        }

        function showView(id) {
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('projectDetailView').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showDashboard() { showView('dashboardView'); }

        // STEP 1: PROJECT INITIATION
        function saveNewProject() {
            const p = {
                id: Date.now(),
                client: document.getElementById('pClient').value,
                address: document.getElementById('pAddress').value,
                manager: document.getElementById('pManager').value,
                targetDate: document.getElementById('pDate').value,
                scans: []
            };
            projects.push(p);
            activeProject = p;
            updateDashboard();
            hideModal('initProjectModal');
            openProject(p.id);
        }

        function updateDashboard() {
            const list = document.getElementById('projectGrid');
            list.innerHTML = projects.map(p => `
                <div class="card" onclick="openProject(${p.id})">
                    <p style="font-size:0.7rem; color:var(--text-secondary);">CLIENT: ${p.client}</p>
                    <h3>${p.address}</h3>
                    <p style="margin-top:1rem; font-size:0.8rem; color:var(--success);">Target: ${p.targetDate}</p>
                </div>
            `).join('');
        }

        // STEP 2: FIELD DATA CAPTURE
        function openProject(id) {
            activeProject = projects.find(p => p.id === id);
            document.getElementById('activeProjectTitle').innerText = activeProject.client;
            document.getElementById('activeProjectInfo').innerText = `Address: ${activeProject.address} | PM: ${activeProject.manager} | Target: ${activeProject.targetDate}`;
            renderScans();
            showView('projectDetailView');
        }

        function initiateScan() {
            if(currentRole === 'vendor') return;
            alert("Activating Camera... Photo Captured.");
            showModal('scanModal');
        }

        function saveScanRecord() {
            const scan = {
                id: Date.now(),
                area: document.getElementById('rArea').value,
                texture: document.getElementById('rTexture').value,
                color: document.getElementById('rColor').value,
                dims: document.getElementById('rDims').value,
                notes: document.getElementById('rNotes').value,
                bid: 'Pending'
            };
            activeProject.scans.push(scan);
            renderScans();
            hideModal('scanModal');
        }

        function renderScans() {
            const grid = document.getElementById('scanGrid');
            grid.innerHTML = activeProject.scans.map(s => `
                <div class="card" style="border-left:4px solid var(--primary);" onclick="showModal('scanModal')">
                    <h4>${s.area}</h4>
                    <p style="font-size:0.8rem; color:var(--text-secondary);">${s.texture} | ${s.dims}</p>
                    <div style="margin-top:1rem; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold;">Bid: ${s.bid === 'Pending' ? s.bid : '$' + s.bid}</span>
                    </div>
                </div>
            `).join('');
        }

        // STEP 4: VENDOR BID
        function submitVendorBid() {
            const bid = document.getElementById('vPrice').value;
            if(activeProject.scans.length > 0) {
                activeProject.scans[activeProject.scans.length - 1].bid = bid;
            }
            renderScans();
            hideModal('scanModal');
            alert("Step 4 Complete: Bid and Timeline data communicated back to Contractor.");
        }

        // STEP 5: REPORTING
        async function generateReport() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const element = document.getElementById('reportTarget');
            
            alert("Step 5: Generating Professional PDF Quote Report...");
            
            html2canvas(element).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdfWidth = doc.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                doc.save("Project_Quote_Summary.pdf");
            });
        }
    </script>
</body>
</html>
