<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Field Utility | Project Quote Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: var(--bg-card);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--border); color: var(--text-primary); }
        .btn-success { background: var(--success); color: white; }
        .btn-toggle { background: var(--warning); color: #000; }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 1rem;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%; max-width: 650px;
            border-radius: 16px; padding: 2rem;
            max-height: 90vh; overflow-y: auto;
        }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 0.8rem;
            background: var(--bg-dark); border: 1px solid var(--border);
            border-radius: 8px; color: white; font-size: 1rem;
        }

        .hidden { display: none !important; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-contractor { background: rgba(37, 99, 235, 0.2); color: var(--primary); }
        .badge-vendor { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    </style>
</head>
<body>

    <header class="header">
        <div>
            <h2>Estimator Pro</h2>
            <div id="roleIndicator" class="badge badge-contractor">Main Contractor</div>
        </div>
        <button class="btn btn-toggle" onclick="toggleRole()">Switch Demo Role</button>
    </header>

    <div class="container">
        <div id="dashboardView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Active Projects</h1>
                <button class="btn btn-primary" onclick="showModal('initModal')">+ Start New Project</button>
            </div>
            <div class="grid" id="projectList">
                <p id="emptyState" style="color: var(--text-secondary);">No active projects. Start a project to begin the demo flow.</p>
            </div>
        </div>

        <div id="projectDetailView" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <button class="btn btn-secondary" onclick="showDashboard()">← Dashboard</button>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-success" onclick="generateProjectPDF()">Download Full Project Quote</button>
                    <button id="archiveAction" class="btn btn-secondary" onclick="archiveCurrentProject()">Archive Project</button>
                </div>
            </div>

            <div id="pdfContent" class="card">
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem;">
                    <h2 id="displayJobName" style="font-size: 2rem;">Project Name</h2>
                    <p id="displayJobInfo" style="color: var(--text-secondary);"></p>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Standardized Service Requests</h3>
                    <button id="contractorAddBtn" class="btn btn-primary" onclick="openRequestModal()">+ Add Photo & Request Info</button>
                </div>

                <div id="requestGrid" class="grid">
                    </div>
            </div>
        </div>
    </div>

    <div id="initModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Project Initiation</h2>
            <div class="form-group"><label>Client Name</label><input type="text" id="mClient" placeholder="e.g. Anderson Residence"></div>
            <div class="form-group"><label>Job Site Address</label><input type="text" id="mAddress" placeholder="Full Site Address"></div>
            <div class="form-group">
                <label>Project Type</label>
                <select id="mType">
                    <option value="Residential Remodel">Residential Remodel</option>
                    <option value="Drywall/Paint Restoration">Drywall/Paint Restoration</option>
                    <option value="General Construction">General Construction</option>
                    <option value="Service/Repair">Service/Repair</option>
                </select>
            </div>
            <div class="form-group"><label>Target Completion Date</label><input type="date" id="mDate"></div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="btn btn-primary" onclick="createNewProject()">Initiate Project</button>
                <button class="btn btn-secondary" onclick="hideModal('initModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="requestModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="margin-bottom: 1rem;">Field Request Details</h2>
            <div style="background: #000; border-radius: 8px; margin-bottom: 1.5rem; text-align: center; padding: 1rem;">
                <p style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 0.5rem;">[Placeholder: Uploaded Job Photo]</p>
                <img src="https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=600" style="max-height: 200px; border-radius: 4px;">
            </div>

            <div id="contractorInputs">
                <div class="form-group">
                    <label>Area of Service</label>
                    <select id="rArea">
                        <option>Ceiling</option><option>Walls</option><option>Trim/Baseboard</option><option>Exterior</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Texture Type</label>
                    <select id="rTexture">
                        <option>Smooth</option><option>Orange Peel</option><option>Popcorn</option><option>Knockdown</option>
                    </select>
                </div>
                <div class="form-group"><label>Color / Paint Code</label><input type="text" id="rColor" placeholder="e.g. SW 7006"></div>
                <div class="form-group"><label>Dimensions (sq ft / linear ft)</label><input type="text" id="rDims"></div>
                <div class="form-group"><label>Required Action / Notes</label><textarea id="rNotes" rows="2"></textarea></div>
            </div>

            <div id="vendorInputs" class="hidden" style="border-top: 2px solid var(--warning); padding-top: 1.5rem; margin-top: 1.5rem;">
                <h3 style="color: var(--warning); margin-bottom: 1rem;">Vendor Estimate Entry</h3>
                <div class="form-group"><label>Estimate Pricing ($)</label><input type="number" id="vPrice"></div>
                <div class="form-group"><label>Timeline Notes / Questions</label><textarea id="vTimeline" rows="2"></textarea></div>
                <button class="btn btn-primary" style="width: 100%;" onclick="saveVendorEntry()">Submit Pricing to Contractor</button>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button id="saveRequestBtn" class="btn btn-primary" onclick="saveRequest()">Save Request Data</button>
                <button class="btn btn-secondary" onclick="hideModal('requestModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        let projects = [];
        let activeProjectId = null;
        let role = 'contractor';

        function toggleRole() {
            role = (role === 'contractor') ? 'vendor' : 'contractor';
            document.getElementById('roleIndicator').innerText = (role === 'contractor') ? 'Main Contractor' : 'Subcontractor';
            document.getElementById('roleIndicator').className = 'badge ' + (role === 'contractor' ? 'badge-contractor' : 'badge-vendor');
            
            document.getElementById('vendorInputs').classList.toggle('hidden');
            document.getElementById('contractorAddBtn').classList.toggle('hidden');
            document.getElementById('archiveAction').classList.toggle('hidden');
            
            const inputs = document.querySelectorAll('#contractorInputs input, #contractorInputs select, #contractorInputs textarea');
            inputs.forEach(i => i.disabled = (role === 'vendor'));
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

        function createNewProject() {
            const project = {
                id: Date.now(),
                client: document.getElementById('mClient').value,
                address: document.getElementById('mAddress').value,
                type: document.getElementById('mType').value,
                date: document.getElementById('mDate').value,
                requests: []
            };
            projects.push(project);
            activeProjectId = project.id;
            updateDashboard();
            openProject(project.id);
            hideModal('initModal');
        }

        function updateDashboard() {
            const list = document.getElementById('projectList');
            if(projects.length > 0) document.getElementById('emptyState').classList.add('hidden');
            list.innerHTML = projects.map(p => `
                <div class="card" onclick="openProject(${p.id})">
                    <p style="font-size: 0.75rem; color: var(--text-secondary);">${p.type}</p>
                    <h3>${p.client}</h3>
                    <p>${p.address}</p>
                    <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--success);">Target Completion: ${p.date}</p>
                </div>
            `).join('');
        }

        function openProject(id) {
            activeProjectId = id;
            const p = projects.find(item => item.id === id);
            document.getElementById('displayJobName').innerText = p.client;
            document.getElementById('displayJobInfo').innerText = `${p.type} | ${p.address} | Due: ${p.date}`;
            renderRequests();
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('projectDetailView').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('projectDetailView').classList.add('hidden');
        }

        function openRequestModal() {
            if(role === 'vendor') return;
            showModal('requestModal');
        }

        function saveRequest() {
            const p = projects.find(item => item.id === activeProjectId);
            p.requests.push({
                area: document.getElementById('rArea').value,
                texture: document.getElementById('rTexture').value,
                color: document.getElementById('rColor').value,
                dims: document.getElementById('rDims').value,
                notes: document.getElementById('rNotes').value,
                price: 'Pending'
            });
            renderRequests();
            hideModal('requestModal');
        }

        function renderRequests() {
            const p = projects.find(item => item.id === activeProjectId);
            const grid = document.getElementById('requestGrid');
            grid.innerHTML = p.requests.map(r => `
                <div class="card" style="border-left: 4px solid var(--primary);" onclick="showModal('requestModal')">
                    <h4>${r.area}</h4>
                    <p style="font-size: 0.85rem; color: var(--text-secondary);">${r.texture} | ${r.dims}</p>
                    <div style="margin-top: 1rem; display: flex; justify-content: space-between;">
                        <span style="font-weight: bold;">Estimate: ${r.price === 'Pending' ? r.price : '$'+r.price}</span>
                    </div>
                </div>
            `).join('');
        }

        function saveVendorEntry() {
            const p = projects.find(item => item.id === activeProjectId);
            if(p.requests.length > 0) {
                p.requests[p.requests.length - 1].price = document.getElementById('vPrice').value;
            }
            renderRequests();
            hideModal('requestModal');
            alert("Pricing communicated to Main Contractor.");
        }

        function archiveCurrentProject() {
            projects = projects.filter(p => p.id !== activeProjectId);
            updateDashboard();
            showDashboard();
            alert("Project moved to archive.");
        }

        function generateProjectPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const content = document.getElementById('pdfContent');
            html2canvas(content).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                doc.addImage(imgData, 'PNG', 10, 10, 190, 0);
                doc.save("Project_Quote_Report.pdf");
            });
        }
    </script>
</body>
</html>
